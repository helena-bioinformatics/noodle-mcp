swagger: '2.0'
info:
  title: Noodle Biomedical Literature Discovery MCP
  description: Read-only search and graph exploration over public biomedical literature.
  version: 0.2.0
host: api.helena.bio
basePath: /noodle/v1
schemes: [https]
consumes: [application/json]
produces: [application/json]
paths:
  /mcp:
    post:
      summary: Invoke the Noodle Biomedical Literature Discovery MCP server
      operationId: InvokeNoodleMCP
      x-ms-agentic-protocol: mcp-streamable-1.0
      parameters:
        - in: body
          name: body
          required: true
          schema: {type: object, additionalProperties: true}
      responses:
        '200':
          description: MCP response
          schema: {type: object, additionalProperties: true}
        default:
          description: MCP protocol error
          schema: {type: object, additionalProperties: true}
