[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noodle-biomedical-literature-discovery-mcp-biorouter"
version = "0.2.0"
description = "Biorouter stdio bridge for Noodle Biomedical Literature Discovery MCP by Helena Bioinformatics"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Helena Bioinformatics", email = "contact@helena.bio"}]
requires-python = ">=3.11"
dependencies = ["fastmcp==3.4.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<10.0"]

[project.scripts]
noodle-biomedical-literature-discovery-mcp = "noodle_biorouter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noodle_biorouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
