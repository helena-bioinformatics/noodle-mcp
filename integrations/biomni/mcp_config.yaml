mcp_servers:
  noodle_biomedical_literature_discovery_mcp:
    enabled: true
    description: >-
      Noodle Biomedical Literature Discovery MCP by Helena Bioinformatics:
      public biomedical literature search, records, and graph traversal
    command:
      - docker
      - run
      - -i
      - --rm
      - --read-only
      - --cap-drop=ALL
      - --security-opt=no-new-privileges
      - --user=65532:65532
      - ghcr.io/sparfenyuk/mcp-proxy:v0.12.0@sha256:ce037447191eeed517faa80640539dedaffb79a3ec107bfd23625a4438b0d06d
      - --transport
      - streamablehttp
      - --log-level
      - WARNING
      - https://api.helena.bio/noodle/v1/mcp
