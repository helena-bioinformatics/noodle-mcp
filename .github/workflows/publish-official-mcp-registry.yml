name: Publish Noodle MCP to the Official Registry

on:
  push:
    tags: ["noodle-mcp-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and publish immutable metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: registry
    steps:
      - name: Check out the public adapter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Verify tag and declared version agree
        shell: bash
        run: |
          set -euo pipefail
          declared_version=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          test "${GITHUB_REF_NAME}" = "noodle-mcp-v${declared_version}"

      - name: Download and validate with the pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          publisher_dir="${RUNNER_TEMP}/mcp-publisher"
          mkdir -p "${publisher_dir}"
          curl --fail --silent --show-error --location \
            --output "${publisher_dir}/publisher.tgz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          printf "%s  %s\n" \
            a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc \
            "${publisher_dir}/publisher.tgz" | sha256sum --check --strict
          tar -xzf "${publisher_dir}/publisher.tgz" -C "${publisher_dir}"
          chmod 0755 "${publisher_dir}/mcp-publisher"
          "${publisher_dir}/mcp-publisher" validate

      - name: Detect an already-published identical immutable version
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          registry_url='https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.helena-bioinformatics%2Fnoodle&version=latest'
          export REGISTRY_JSON="${RUNNER_TEMP}/registry.json"
          curl --fail --silent --show-error --location \
            --output "${REGISTRY_JSON}" "${registry_url}"
          if python3 - <<'PY'
          import json
          import os

          declared = json.load(open("server.json", encoding="utf-8"))
          observed = json.load(open(os.environ["REGISTRY_JSON"], encoding="utf-8"))
          records = observed.get("servers", [])
          if len(records) != 1:
              raise SystemExit(1)
          record = records[0]
          server = record.get("server", {})
          official = record.get("_meta", {}).get(
              "io.modelcontextprotocol.registry/official", {}
          )
          expected = {
              "name": declared["name"],
              "title": declared["title"],
              "version": declared["version"],
              "description": declared["description"],
              "remote": declared["remotes"][0]["url"],
          }
          actual = {
              "name": server.get("name"),
              "title": server.get("title"),
              "version": server.get("version"),
              "description": server.get("description"),
              "remote": (server.get("remotes") or [{}])[0].get("url"),
          }
          if actual != expected or official.get("status") != "active" or not official.get("isLatest"):
              raise SystemExit(1)
          PY
          then
            echo 'already_published=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'already_published=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Authenticate with short-lived GitHub OIDC
        if: steps.registry.outputs.already_published != 'true'
        shell: bash
        run: >-
          "${RUNNER_TEMP}/mcp-publisher/mcp-publisher" login github-oidc
          --registry https://registry.modelcontextprotocol.io

      - name: Publish the immutable version
        if: steps.registry.outputs.already_published != 'true'
        shell: bash
        run: |
          "${RUNNER_TEMP}/mcp-publisher/mcp-publisher" publish
